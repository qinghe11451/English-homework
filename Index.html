<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>我的个人主页</title>
<style>
  :root {
    --primary: #4f46e5;
    --bg: #f8fafc;
    --text: #1e293b;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.6;
  }
  header {
    text-align: center;
    padding: 60px 20px;
    background: linear-gradient(135deg, #4f46e5, #7c3aed);
    color: #fff;
    border-radius: 0 0 24px 24px;
  }
  .avatar {
    width: 120px; height: 120px;
    border-radius: 50%;
    background: #fff;
    margin: 0 auto 20px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 48px;
    color: var(--primary);
  }
  h1 { font-size: 2rem; margin-bottom: 10px; }
  .tagline { opacity: .9; }
  .container { max-width: 900px; margin: 0 auto; padding: 40px 20px; }
  section { margin: 40px 0; }
  h2 { font-size: 1.4rem; margin-bottom: 16px; color: var(--primary); }
  .card {
    background: #fff;
    padding: 24px;
    border-radius: 16px;
    box-shadow: 0 4px 20px rgba(0,0,0,.06);
  }
  .skills { display: flex; flex-wrap: wrap; gap: 10px; }
  .skill {
    background: #eef2ff;
    color: var(--primary);
    padding: 6px 14px;
    border-radius: 999px;
    font-size: .9rem;
  }
  .btn {
    display: inline-block;
    background: var(--primary);
    color: #fff;
    padding: 12px 28px;
    border-radius: 999px;
    text-decoration: none;
    border: none;
    cursor: pointer;
    font-size: 1rem;
    transition: .3s;
    margin-top: 10px;
  }
  .btn:hover {
    background: #4338ca;
    transform: translateY(-2px);
  }
  footer {
    text-align: center;
    padding: 30px;
    color: #64748b;
    font-size: .9rem;
  }
  @media (max-width: 600px) {
    header { padding: 40px 16px; }
    h1 { font-size: 1.6rem; }
  }
</style>
</head>
<body>

<header>
  <div class="avatar">😊</div>
  <h1>你的名字</h1>
  <p class="tagline">一句话介绍自己 · 比如：热爱编程与设计</p >
</header>

<div class="container">
  <section>
    <h2>关于我</h2>
    <div class="card">
      <p>这里写一段自我介绍。你可以写自己的职业、兴趣、正在学习的东西，或者这个网页的目的。</p >
    </div>
  </section>

  <section>
    <h2>技能</h2>
    <div class="card">
      <div class="skills">
        <span class="skill">HTML</span>
        <span class="skill">CSS</span>
        <span class="skill">JavaScript</span>
        <span class="skill">设计</span>
      </div>
    </div>
  </section>

  <section>
    <h2>联系我</h2>
    <div class="card">
      <p>邮箱：hello@example.com</p >
      <p>微信：your_wechat</p >
      <button class="btn" onclick="sayHello()">打个招呼</button>
    </div>
  </section>
</div>

<footer>© 2026 你的名字. 保留所有权利.</footer>

<script>
  function sayHello() {
    alert('你好！很高兴认识你 👋');
  }
</script>
</body>
</html>
